baseURL = "https://laont.me/"
languageCode = "en-us"
title = "LAONTME - Systems over symptoms"
enableRobotsTXT = true

[params]
description = "LAONTME — personal system interface of Stanislav Smirnov. Platform engineer building developer tools, agent systems, and open-source software. Based in Tbilisi."

[params.author]
name = "Stanislav Smirnov"
email = "yo@laont.me"
# images = ["/og-image.png"]

[params.social]
linkedin = "laontme"
twitter = "laontmeow"
github = "laontme"


# [markup]

# [markup.goldmark.renderer]
# unsafe = true


[build]

[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.js'
target = 'css'


[module]

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'



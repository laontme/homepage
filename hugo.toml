writing_topics = "/writing/topics/:slug/"
series = "/writing/series/:slug/"

[permalinks.page]
blog = "/writing/:slug/"
companies = "/work/companies/:slug/"
projects = "/work/projects/:slug/"
stories = "/work/stories/:slug/"

[permalinks.section]
blog = "/writing/"
companies = "/work/"
projects = "/work/projects/"
stories = "/work/stories/"


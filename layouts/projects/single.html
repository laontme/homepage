{{ define "main" }}
<section class="py-24">
  <article class="max-w-6xl mx-auto px-6">
    <header class="max-w-3xl mb-10">
      {{ partial "components/back-link.html" (dict "href" "/work/projects/" "text" "Projects") }}
      <h1 class="font-headline text-4xl md:text-5xl font-bold mt-6 mb-4">{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="text-xl text-secondary leading-relaxed max-w-3xl">{{ . }}</p>{{ end }}
      {{ partial "components/work-topics.html" . }}
    </header>
    <div class="prose-blog max-w-3xl">{{ .Content }}</div>
    {{ partial "components/related-links.html" . }}
  </article>
</section>
{{ end }}
